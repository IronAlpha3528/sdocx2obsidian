[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdocx2obsidian"
version = "0.1.0"
description = "Batch-convert Samsung Notes .sdocx files to Obsidian Markdown"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
sdocx2obsidian = "sdocx2obsidian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sdocx2obsidian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=sdocx2obsidian --cov-branch --cov-report=term-missing"
pythonpath = ["src", "."]
markers = [
    "real_samples: tests using real .sdocx sample files in samples/",
]

[tool.coverage.run]
branch = true
source = ["src/sdocx2obsidian"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN", "S", "PTH", "T20", "C90", "PLR0915", "RET", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN401", "PLR0915"]
"src/sdocx2obsidian/cli.py" = ["T20"]
